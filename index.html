<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UND 예약관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="남양주 쇼룸 리드 TM · 예약 캘린더 · 고객 카드 · Meta 리드 가져오기 · 문자 · 편집되는 스크립트와 매뉴얼">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Gothic+A1:wght@400;500;700;800&display=swap">
<style>
/* 작업대 — 왼쪽 먹색 레일(메뉴·저장 상태) · 가운데 작업면(오늘·고객·캘린더·통화·문자·매뉴얼·설정) · 오른쪽 고객 카드 서랍 */
:root{
  --ground:#F3F1ED; --surface:#FFFFFF; --surface-2:#F8F7F4; --sunk:#EEEBE6;
  --ink:#151413; --ink-2:#4B4743; --mute:#857F78; --line:#E2DDD5; --line-2:#CBC4B9;
  --rail:#131211; --rail-fg:#F2EFEA; --rail-mute:#9D978F; --rail-line:#2A2826;
  --accent:#1B44E5; --accent-ink:#FFFFFF; --accent-soft:#E8ECFF; --accent-line:#B7C4FF;
  --late:#B3261E; --late-ink:#FFFFFF; --late-soft:#FBE7E4;
  --today:#9A5B00; --today-bg:#FFD66B; --today-soft:#FFF2D6;
  --g-tm:#2347D6; --g-tm-soft:#E7ECFF;
  --g-rsv:#86570A; --g-rsv-soft:#FFF0D2;
  --g-visit:#2F6B3F; --g-visit-soft:#E1F1E5;
  --g-order:#1F5F5B; --g-order-soft:#DCEFED;
  --g-end:#78726B; --g-end-soft:#ECE9E5;
  --say:#EEF2FF; --say-line:#C9D3FF;
  --shadow:0 18px 48px rgba(20,18,16,.18);
  --kr:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif;
  --num:'Archivo','Helvetica Neue',Arial,sans-serif;
  --railw:216px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121110; --surface:#1B1A18; --surface-2:#211F1D; --sunk:#171615;
    --ink:#EDEAE4; --ink-2:#BEB8B0; --mute:#8D877F; --line:#2E2B28; --line-2:#3E3A35;
    --rail:#0B0A0A; --rail-fg:#EDEAE4; --rail-mute:#8D877F; --rail-line:#24221F;
    --accent:#8EA3FF; --accent-ink:#0C0C10; --accent-soft:#1F2547; --accent-line:#3C4A8E;
    --late:#FF8F84; --late-ink:#1B0A08; --late-soft:#3B1A16;
    --today:#F4BC55; --today-bg:#C99A2E; --today-soft:#35290F;
    --g-tm:#A3B4FF; --g-tm-soft:#1F2547; --g-rsv:#EBC074; --g-rsv-soft:#33270F;
    --g-visit:#86CFA0; --g-visit-soft:#15301E; --g-order:#7ACBC3; --g-order-soft:#10302D;
    --g-end:#A8A198; --g-end-soft:#272523;
    --say:#1D2342; --say-line:#34407A; --shadow:0 18px 48px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121110; --surface:#1B1A18; --surface-2:#211F1D; --sunk:#171615;
  --ink:#EDEAE4; --ink-2:#BEB8B0; --mute:#8D877F; --line:#2E2B28; --line-2:#3E3A35;
  --rail:#0B0A0A; --rail-fg:#EDEAE4; --rail-mute:#8D877F; --rail-line:#24221F;
  --accent:#8EA3FF; --accent-ink:#0C0C10; --accent-soft:#1F2547; --accent-line:#3C4A8E;
  --late:#FF8F84; --late-ink:#1B0A08; --late-soft:#3B1A16;
  --today:#F4BC55; --today-bg:#C99A2E; --today-soft:#35290F;
  --g-tm:#A3B4FF; --g-tm-soft:#1F2547; --g-rsv:#EBC074; --g-rsv-soft:#33270F;
  --g-visit:#86CFA0; --g-visit-soft:#15301E; --g-order:#7ACBC3; --g-order-soft:#10302D;
  --g-end:#A8A198; --g-end-soft:#272523;
  --say:#1D2342; --say-line:#34407A; --shadow:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--kr);font-size:14px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.035em;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--rail);color:var(--rail-fg);padding:20px 0 16px;padding-left:env(safe-area-inset-left,0px);overflow-y:auto}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--rail-line)}
.brand b{display:block;font-family:var(--num);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.brand span{display:block;margin-top:7px;font-size:12px;color:var(--rail-mute)}
.nav{display:flex;flex-direction:column;padding:12px 10px;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;color:var(--rail-mute);font-size:14px;font-weight:700;text-align:left;cursor:pointer;border-radius:2px}
.nav button svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button:hover{color:var(--rail-fg);background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:var(--rail-fg);background:rgba(255,255,255,.08);box-shadow:inset 3px 0 0 var(--accent-line)}
.nav .badge{margin-left:auto;display:flex;gap:4px}
.nav .badge i{font-style:normal;font-family:var(--num);font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 5px;border-radius:2px;background:rgba(255,255,255,.1);color:var(--rail-fg)}
.nav .badge i.late{background:var(--late);color:var(--late-ink)}
.nav .badge i.today{background:var(--today-bg);color:#1A1405}
.rail-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--rail-line);display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--rail-mute)}
.rail-foot label{display:flex;flex-direction:column;gap:4px}
.rail-foot select{background:transparent;border:1px solid var(--rail-line);color:var(--rail-fg);padding:6px 8px;border-radius:2px}
.rail-foot select option{color:#111;background:#fff}
.mode{display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.mode .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--rail-mute)}
.mode.shared .dot{background:#5BD88A}.mode.local .dot{background:#F4BC55}.mode.demo .dot{background:var(--accent-line)}.mode.readonly .dot{background:#FF8F84}
.mode b{color:var(--rail-fg);font-weight:700}
.rail-foot .ghost{background:none;border:1px solid var(--rail-line);color:var(--rail-fg);padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;border-radius:2px;text-align:left}
.rail-foot .ghost:hover{border-color:var(--rail-mute)}

.main{min-width:0;display:flex;flex-direction:column}
@media (min-width: 901px){.app{background:linear-gradient(90deg,var(--rail) var(--railw),transparent var(--railw))}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--ground);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:800;white-space:nowrap}
.top .sub{color:var(--mute);font-size:13px;white-space:nowrap}
.search{position:relative;margin-left:auto;flex:0 1 320px;min-width:0}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line-2);background:var(--surface);border-radius:2px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:1.8}
.search-res{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);z-index:40;max-height:340px;overflow:auto}
.search-res button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.search-res button:hover,.search-res button:focus-visible{background:var(--surface-2)}
.search-res .empty{padding:12px;color:var(--mute)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.views{padding-block:22px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:16px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--ink);font-size:13px}
.banner.warn{border-color:var(--late);background:var(--late-soft)}
.banner .btn{margin-left:auto}

/* ---------- buttons · chips · inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;line-height:1.3;cursor:pointer;border-radius:2px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.lg{padding:11px 16px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .code{font-family:var(--num);font-weight:800}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:2px;font-size:12px;font-weight:700;line-height:1.6;white-space:nowrap;border:1px solid transparent}
.chip.late{background:var(--late);color:var(--late-ink)}
.chip.today{background:var(--today-bg);color:#1A1405}
.chip.plan{background:var(--sunk);color:var(--mute)}
.chip.new{background:var(--accent);color:#fff}
.tline{display:block;font-size:12px;color:var(--mute);font-family:var(--num);white-space:nowrap}
.tline .k{font-family:inherit;font-weight:700;margin-right:4px;color:var(--ink,inherit)}
.st{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:2px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.6}
.st .n{font-family:var(--num);font-weight:800;opacity:.75}
.st.tm{background:var(--g-tm-soft);color:var(--g-tm)}.st.rsv{background:var(--g-rsv-soft);color:var(--g-rsv)}
.st.visit{background:var(--g-visit-soft);color:var(--g-visit)}.st.order{background:var(--g-order-soft);color:var(--g-order)}
.st.end{background:var(--g-end-soft);color:var(--g-end)}
.code-b{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:1px 5px;background:var(--ink);color:var(--ground);font-family:var(--num);font-weight:800;font-size:12px;border-radius:2px}
.code-b.ad{background:var(--late);color:var(--late-ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{width:100%;padding:8px 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:2px;min-width:0}
.field textarea{resize:vertical;min-height:72px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line-2);background:var(--surface);padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.pad>.seg,.field>.seg{align-self:flex-start}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.muted{color:var(--mute)}
.small{font-size:12px}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
.warn-t{color:var(--late);font-weight:700}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line)}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:15px;font-weight:800}
.panel>header .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel .pad{padding:14px 16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- 오늘 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:18px}
.stat{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--num);font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute);font-weight:700}
.stat.late b{color:var(--late)}.stat.today b{color:var(--today)}
.task{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.task .who b{font-size:15px}
.task .who .num{color:var(--mute);font-size:12px}
.task .what{grid-column:2;font-weight:700;color:var(--ink);min-width:0}
.task .what .d{font-family:var(--num);color:var(--late);font-weight:700;font-size:12px;margin-left:6px}
.task .go{grid-column:3;grid-row:1 / span 2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.task .fl{grid-row:1 / span 2;align-self:start;padding-top:2px}
.task.is-late{background:linear-gradient(90deg,var(--late-soft),transparent 60%)}
.task-group{padding:8px 16px;font-size:12px;font-weight:800;color:var(--mute);background:var(--surface-2);border-bottom:1px solid var(--line);letter-spacing:.02em}
.empty-state{padding:28px 20px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-state b{color:var(--ink);font-size:15px}
.visit-row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.visit-row:hover{background:var(--surface-2)}
.visit-row .t{font-family:var(--num);font-weight:800;font-size:15px}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .row{display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:12px}
.funnel .bar{height:10px;background:var(--sunk);position:relative}
.funnel .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.funnel .row b{font-family:var(--num);text-align:right}
.week-mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.week-mini div{background:var(--surface);padding:8px 6px;text-align:center;font-size:12px}
.week-mini div b{display:block;font-family:var(--num);font-size:18px}
.week-mini div.is-today{background:var(--accent-soft)}

/* ---------- 고객 ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .inp{width:220px}
.toolbar select.inp{width:auto}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}
table.list{width:100%;border-collapse:collapse;min-width:960px}
table.list th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;color:var(--ink-2);font-weight:800;padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--surface-2)}
table.list tr.is-late td:first-child{box-shadow:inset 3px 0 0 var(--late)}
table.list .nm b{display:block}
table.list .inat{white-space:nowrap}
table.list .inat b{display:block;font-weight:700}
table.list .inat .tm{color:var(--mute);font-size:12px;margin-right:6px}
table.list .nm .num{color:var(--mute);font-size:12px}
.cards{display:none}
.ccard{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.ccard.is-late{box-shadow:inset 3px 0 0 var(--late)}
.ccard .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ccard-open{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0;flex:1 1 auto}
.ccard .l2{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ccard .l3{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;font-size:12px;padding-top:8px;border-top:1px dashed var(--line)}
.ccard .fld{display:inline-flex;gap:4px;align-items:center;min-width:0}
.ccard .fld>.k{color:var(--mute);font-weight:700;white-space:nowrap}

/* ---------- 목록에서 바로 고치기 — 진행상태 고르기 · 날짜 · 시간 · 담당 ---------- */
.stw{position:relative;display:inline-flex;align-items:center;padding:0;border-radius:2px;max-width:100%;vertical-align:middle}
.stw select{-webkit-appearance:none;appearance:none;border:0;background:transparent;color:inherit;font-family:var(--kr);font-size:12px;font-weight:700;line-height:1.6;letter-spacing:-.01em;padding:2px 22px 2px 7px;cursor:pointer;max-width:100%;border-radius:2px}
.stw::after{content:"";position:absolute;right:8px;top:50%;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;opacity:.75}
.stw:hover{box-shadow:inset 0 0 0 1px currentColor}
.stw:focus-within{box-shadow:0 0 0 2px var(--accent)}
.stw select:focus{outline:none}
.stw select:disabled{cursor:default}
.stw:has(select:disabled)::after{display:none}
.stw:has(select:disabled):hover{box-shadow:none}
.stw select option,.stw select optgroup{color:var(--ink);background:var(--surface);font-weight:500}
.inl{font-family:var(--num);font-size:13px;letter-spacing:0;color:var(--ink);border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:2px;min-width:0;max-width:100%;line-height:1.4}
select.inl{font-family:var(--kr);cursor:pointer;padding-right:2px}
.inl:hover:not(:disabled){border-color:var(--line-2);background:var(--surface)}
.inl:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inl:disabled{opacity:.5;cursor:default}
.inl.empty{border:1px dashed var(--line-2);color:var(--mute)}
.rsvin,.inin{display:inline-flex;gap:2px;align-items:center;white-space:nowrap}
.inin .muted{padding-left:2px}
table.list td.fl{white-space:nowrap}
table.list .nm .num{white-space:nowrap}
table.list td.fl .num{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
table.list td.act{min-width:170px}
table.list td.act>span{display:block}
table.list td.act .btn{margin-top:5px}
tr.flash td,.ccard.flash{animation:flashrow 1.8s ease-out}
@keyframes flashrow{0%,30%{background:var(--today-soft)}}
@media (pointer:coarse){.inl,.stw select{font-size:16px}}

/* ---------- 캘린더 ---------- */
.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.calbar h2{font-size:16px;font-weight:800;margin:0 6px}
.calwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table.cal{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
table.cal th,table.cal td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
table.cal th:last-child,table.cal td:last-child{border-right:0}
table.cal thead th{padding:9px 8px;font-size:13px;font-weight:800;background:var(--surface-2);text-align:center}
table.cal thead th .num{display:block;font-size:11px;color:var(--mute);font-weight:700}
table.cal thead th.is-today{background:var(--accent-soft);color:var(--accent)}
table.cal thead th.is-hol{color:var(--late)}
table.cal tbody th{width:70px;padding:8px;font-family:var(--num);font-weight:800;font-size:14px;background:var(--surface-2);text-align:center;vertical-align:top}
table.cal tbody th small{display:block;font-family:var(--kr);font-size:11px;color:var(--mute);font-weight:500}
table.cal td{height:64px;padding:4px;vertical-align:top}
table.cal td.is-past{background:var(--surface-2)}
table.cal td.is-closed{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--sunk) 6px 12px)}
table.cal td.is-hol{background:var(--late-soft)}
table.cal td.is-over{box-shadow:inset 0 0 0 2px var(--late)}
.slotadd{width:100%;height:100%;min-height:54px;border:1px dashed transparent;background:none;color:var(--mute);font-size:12px;cursor:pointer;border-radius:2px}
.slotadd:hover,.slotadd:focus-visible{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.bk{display:flex;flex-direction:column;gap:1px;width:100%;padding:5px 7px;margin-bottom:3px;border:0;border-left:3px solid var(--g-rsv);background:var(--g-rsv-soft);text-align:left;cursor:pointer;font-size:12px;line-height:1.35;border-radius:0 2px 2px 0;color:var(--ink)}
.bk b{font-size:13px}
.bk[data-drag]{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.bk-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.25);margin:0}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
.bk.dragging{opacity:.45}
table.cal td.drop-ok{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--g-rsv-soft)}
table.cal td.drop-no{outline:2px dashed var(--late);outline-offset:-3px}
.bk.visit{border-color:var(--g-visit);background:var(--g-visit-soft)}
.bk.noshow{border-color:var(--late);background:var(--late-soft)}
.bk.order{border-color:var(--g-order);background:var(--g-order-soft)}
.agenda{display:none;flex-direction:column;gap:12px}
.agenda .day{background:var(--surface);border:1px solid var(--line)}
.agenda .day h3{padding:9px 12px;font-size:14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.agenda .slotrow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.agenda .slotrow:last-child{border-bottom:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}

/* ---------- 통화 도우미 ---------- */
.callgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.step>:not(.k){grid-column:2;min-width:0}
.step:last-of-type{border-bottom:0}
.step .k{grid-column:1;grid-row:1 / span 6;font-family:var(--num);font-weight:800;font-size:20px;color:var(--accent);line-height:1.2}
.step h3{font-size:14px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.step h3 .num{color:var(--mute);font-size:12px;font-weight:700}
.say{padding:10px 12px;background:var(--say);border-left:3px solid var(--accent);font-size:15px;line-height:1.7;color:var(--ink)}
.say mark{background:none;color:var(--accent);font-weight:800}
.tip{font-size:12.5px;color:var(--ink-2)}
.tip mark{background:none;color:var(--accent);font-weight:700}
.slotpick{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.slotpick button{padding:8px 12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;border-radius:2px;text-align:left;line-height:1.35}
.slotpick button small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.slotpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.results{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.results button{padding:10px 6px;border:1px solid var(--line-2);background:var(--surface);font-weight:800;cursor:pointer;border-radius:2px;font-size:13px}
.results button.conn{border-color:var(--g-tm-soft);background:var(--g-tm-soft);color:var(--g-tm)}
.results button.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.results button.na{background:var(--sunk);color:var(--ink-2)}
.results button.void{color:var(--late);border-color:var(--late-soft)}
.results button:hover{filter:brightness(.96)}
.timer{display:flex;align-items:center;gap:10px}
.timer .num{font-size:22px;font-weight:800}
.qa-item{padding:10px 14px;border-bottom:1px solid var(--line)}
.qa-item:last-child{border-bottom:0}
.qa-item b{display:block;font-size:13px}
.qa-item p{font-size:13.5px;margin-top:2px}
.qa-item .m{font-size:12px;color:var(--mute);margin-top:3px}
.ref h3{font-size:15px;font-weight:800;padding:14px 16px 10px}
.ref .rows{border-top:1px solid var(--line)}
.ref .r3{display:grid;grid-template-columns:160px minmax(0,1.3fr) minmax(0,1fr);gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.ref .r2{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.ref .r3>b,.ref .r2>b{font-weight:800}
.ref .sayline{color:var(--ink);background:var(--say);padding:4px 8px;border-left:2px solid var(--accent)}
details.fold{background:var(--surface);border:1px solid var(--line)}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:800;list-style:none;display:flex;gap:10px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";font-family:var(--num);font-weight:800;color:var(--accent);width:12px}
details.fold[open]>summary::before{content:"–"}
details.fold>summary .muted{font-weight:500;font-size:12px}

/* ---------- 문자 ---------- */
.smsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.smscard{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.smscard header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.smscard header b{font-size:14px}
.smscard .when{padding:8px 12px 0;font-size:12px;color:var(--ink-2)}
.smscard .body{margin:8px 12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);white-space:pre-wrap;font-size:13px;line-height:1.65;flex:1}
.smscard .body mark,.composer mark{background:var(--today-soft);color:var(--today);font-weight:800;padding:0 2px}
.smscard footer{display:flex;gap:8px;align-items:center;padding:0 12px 12px;flex-wrap:wrap}
.smscard footer .by{font-size:12px;color:var(--mute);margin-right:auto}
.smscard.is-now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ---------- 매뉴얼 ---------- */
.man{max-width:980px;display:flex;flex-direction:column;gap:16px}
.man .sec{background:var(--surface);border:1px solid var(--line)}
.man .sec h2{font-size:16px;font-weight:800;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.man .sec h2 .num{color:var(--accent);font-size:13px}

/* ---------- 설정 ---------- */
.set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.set .panel .pad{display:flex;flex-direction:column;gap:12px}
.slotset{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px 10px;align-items:center;font-size:13px}
.slotset b{font-family:var(--num)}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.taglist span{display:inline-flex;gap:6px;align-items:center;padding:3px 4px 3px 9px;border:1px solid var(--line-2);border-radius:2px;font-size:13px}
.taglist button{border:0;background:none;cursor:pointer;color:var(--mute);font-size:14px;line-height:1;padding:0 4px}
.hol-list{max-height:220px;overflow:auto;border:1px solid var(--line)}
.hol-list div{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.post-list{display:flex;flex-direction:column;gap:8px}
.post-list .row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 10px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:13px}
.post-list .row .f{grid-column:2;display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px}

/* ---------- 서랍(고객 카드) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.32);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:60;background:var(--ground);border-left:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{padding:14px 18px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dr-head .l1{display:flex;gap:10px;align-items:center}
.dr-head h2{font-size:20px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.dr-head .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);padding:4px 6px}
.dr-head .l2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.dr-body{flex:1;overflow-y:auto;padding:14px 18px 40px;display:flex;flex-direction:column;gap:14px}
.next{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent)}
.next.late{border-top-color:var(--late)}.next.today{border-top-color:var(--today-bg)}.next.done{border-top-color:var(--g-end)}
.next .pad{display:flex;flex-direction:column;gap:10px}
.next .lab{font-size:12px;font-weight:800;color:var(--mute);display:flex;gap:8px;align-items:center}
.next .act{font-size:16px;font-weight:800}
.next .btns{display:flex;gap:6px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quick .btn{padding:9px 4px}
.dsec{background:var(--surface);border:1px solid var(--line)}
.dsec>h3{font-size:13px;font-weight:800;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dsec>h3 .r{margin-left:auto;display:flex;gap:6px}
.dsec .pad{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:13px;align-items:center}
.kv>span{color:var(--mute);font-size:12px;font-weight:700}
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:92px minmax(0,1fr) 22px;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.tl-item:last-child{border-bottom:0}
.tl-item time{font-family:var(--num);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl-item .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px;line-height:1;padding:2px}
.tl-item .x:hover{color:var(--late)}
.tl-kind{font-weight:800;margin-right:4px}

/* ---------- 모달 ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:max(32px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(10,9,8,.42);overflow-y:auto}
.modal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal>header{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal>header h2{font-size:17px;font-weight:800}
.modal>header .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink-2);line-height:1;padding:2px 6px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal>footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.composer textarea{width:100%;min-height:230px;padding:12px;border:1px solid var(--line-2);background:var(--surface-2);line-height:1.65;font-size:14px;border-radius:2px;resize:vertical}
.composer .preview{white-space:pre-wrap;padding:10px 12px;border:1px dashed var(--line-2);font-size:13px;line-height:1.6;max-height:140px;overflow:auto}
.missing{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.weekpick{display:flex;flex-direction:column;gap:8px}
.weekpick .wd{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.weekpick .wd>b{font-size:13px}
.weekpick .ts{display:flex;gap:4px;flex-wrap:wrap}
.weekpick .ts button{padding:5px 8px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--num);font-weight:700;font-size:12px;cursor:pointer;border-radius:2px}
.weekpick .ts button[disabled]{text-decoration:line-through;opacity:.4;cursor:not-allowed}
.weekpick .ts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 76px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--ground);padding:10px 16px;font-weight:700;font-size:13px;box-shadow:var(--shadow);border-radius:2px;max-width:calc(100% - 32px)}
.tabbar{display:none}

/* ---------- 편집 — 목록마다 수정 · 삭제 · 순서, 끝에 추가 ---------- */
.edbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.edbar .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.banner.edit-on{border-color:var(--accent);background:var(--accent-soft)}
.banner.edit-on .btn{margin-left:auto}
.edc{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;align-self:start;justify-self:end;margin-left:auto}
.edc .btn{padding:3px 8px;font-size:12px;font-weight:700}
.edc .btn.mv{padding:3px 7px;font-family:var(--num);min-width:26px}
.btn.del{color:var(--late)}
.btn.del:hover{border-color:var(--late)}
.edadd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px dashed var(--line-2);background:var(--surface-2)}
.edmark{margin-left:6px;font-weight:700}
.qa-item .qh{display:flex;gap:8px;align-items:flex-start}
.qa-item .qh b{flex:1;min-width:0}
.step h3 .edc{margin-left:auto}
.ref.editing .r2{grid-template-columns:160px minmax(0,1fr) auto}
.ref.editing .r3{grid-template-columns:160px minmax(0,1.3fr) minmax(0,1fr) auto}
.man .sec h2 .tt{min-width:0}
.man .sec h2 .edc{margin-left:auto}
.man .sec h2{align-items:center;flex-wrap:wrap}
.vchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.vchips button{border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:2px 7px;border-radius:2px;cursor:pointer}
.vchips button:hover{border-color:var(--accent)}
.modal .field textarea.inp{min-height:84px;resize:vertical;line-height:1.55}
.ovr-list>div{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.ovr-list>div:last-child{border-bottom:0}
.memo-line{margin-top:6px;white-space:pre-line;color:var(--ink-2)}

/* ---------- Meta 잠재 고객 가져오기 ---------- */
.syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.alog{margin-top:16px}
.alog .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.alog table{width:100%;border-collapse:collapse;font-size:13px}
.alog th{text-align:left;font-size:12px;color:var(--ink-2);padding:7px 10px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.alog td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.alog td.at{white-space:nowrap;font-family:var(--num);color:var(--ink-2)}
.op{display:inline-block;padding:1px 7px;border-radius:2px;font-size:12px;font-weight:700;white-space:nowrap}
.op.c{background:var(--g-visit-soft);color:var(--g-visit)}.op.u{background:var(--g-rsv-soft);color:var(--g-rsv)}.op.d{background:var(--late-soft);color:var(--late)}
.wpfar .ts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wpfar-ts{display:contents}
.impstrip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border:1px dashed var(--line-2);background:var(--surface);font-size:13px}
.impstrip>svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8;flex:none}
.impstrip>span:first-of-type{flex:1 1 300px;min-width:0}
.impstrip .btns{display:flex;gap:6px;flex-wrap:wrap}
label.btn{cursor:pointer}
.drop{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,9,8,.5);pointer-events:none}
.drop>div{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:36px 40px;border:2px dashed var(--accent);background:var(--surface);max-width:520px;box-shadow:var(--shadow)}
.drop b{font-size:18px}
.drop span{color:var(--mute);font-size:13px}
.modal>header>.muted{min-width:0}
details.fold>summary .sl{flex:none;white-space:nowrap}
details.fold>summary .muted{min-width:0}
.imp .sumrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imp-notes{margin-top:6px}
.chip.ok{background:var(--accent);color:var(--accent-ink)}
.ck-list{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.ck{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.imp .fold .pad{display:flex;flex-direction:column;gap:12px}
.imp-prev{max-height:340px;overflow:auto;border:1px solid var(--line)}
table.prev{width:100%;border-collapse:collapse;font-size:12.5px;min-width:660px}
table.prev th{position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-weight:800;color:var(--ink-2)}
table.prev td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.prev td.num{white-space:nowrap}
table.prev tr.off td{color:var(--mute)}
table.prev td.memo{white-space:pre-line;max-width:280px;color:var(--ink-2)}
table.prev tr.off td.memo{color:var(--mute)}
.pill{display:inline-block;padding:0 6px;border-radius:2px;font-size:11.5px;font-weight:800;white-space:nowrap;line-height:1.7}
.pill.new{background:var(--accent-soft);color:var(--accent)}

<script>
(function () {
  var SB_URL = 'https://srkoimuotdbjglobyegx.supabase.co';
  var SB_KEY = 'sb_publishable_vWf1As3_efcDdda2GuWQWA_C7oHGoP_';
  var sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  window.UND_SB = sb;

  function errCode(e) {
    if (!e) return { code: 'unavailable' };
    if (e.code === '42501' || /row-level security|permission denied/i.test(e.message || '')) return { code: 'not_granted', message: e.message };
    if (e.code === '54000' || /too large/i.test(e.message || '')) return { code: 'quota_exceeded', message: e.message };
    return { code: 'unavailable', message: e.message };
  }
  // 아이디만 입력하면 아이디@und.local 계정으로 로그인 (메일 인증 없이 대시보드에서 만든 계정)
  function toEmail(v) { v = v.trim().toLowerCase(); return v.indexOf('@') < 0 ? v + '@und.local' : v; }
  function idOf(email) { return /@und\.local$/.test(email) ? email.slice(0, -10) : email; }
  function split(path) { var i = path.indexOf('/'); return [path.slice(0, i), path.slice(i + 1)]; }

  // ---- 로그인 게이트: 직원 로그인이 끝나야 db 가 열림
  var ready = new Promise(function (resolve) {
    function showLogin(msg) {
      var box = document.getElementById('und-auth');
      if (!box) {
        box = document.createElement('div'); box.id = 'und-auth';
        box.innerHTML = '<form><h1>UND 예약관리</h1><p>직원 아이디로 로그인하세요</p>' +
          '<input name="email" type="text" placeholder="아이디" autocomplete="username" autocapitalize="off" required>' +
          '<input name="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>' +
          '<p class="err"></p><button type="submit">로그인</button></form>';
        document.body.appendChild(box);
        box.querySelector('form').addEventListener('submit', function (ev) {
          ev.preventDefault();
          var f = ev.target, btn = f.querySelector('button'), er = f.querySelector('.err');
          btn.disabled = true; er.textContent = '';
          sb.auth.signInWithPassword({ email: toEmail(f.email.value), password: f.pw.value }).then(function (r) {
            btn.disabled = false;
            if (r.error) { er.textContent = '아이디 또는 비밀번호가 맞지 않습니다'; return; }
            check(r.data.session);
          });
        });
      }
      box.querySelector('.err').textContent = msg || '';
    }
    function check(session) {
      if (!session) { showLogin(); return; }
      sb.rpc('am_i_staff').then(function (r) {
        if (r.error || !r.data) { sb.auth.signOut(); showLogin('등록된 직원 계정이 아닙니다 — 관리자에게 문의하세요'); return; }
        var box = document.getElementById('und-auth'); if (box) box.remove();
        if (!document.getElementById('und-logout')) {
          var b = document.createElement('button'); b.id = 'und-logout'; b.textContent = '로그아웃 (' + idOf(session.user.email) + ')';
          b.onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); };
          document.body.appendChild(b);
        }
        resolve(session);
      });
    }
    function start() { sb.auth.getSession().then(function (r) { check(r.data.session); }); }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  });

  // ---- Firestore 비슷한 최소 API (앱이 쓰는 것만)
  function collectionRef(col) {
    return {
      onSnapshot: function (cb, onErr) {
        var map = {};
        function emit() {
          cb({ docs: Object.keys(map).map(function (id) { var v = map[id]; return { id: id, data: function () { return v; } }; }) });
        }
        function loadAll(from) {
          return sb.from('docs').select('id,data').eq('collection', col).order('id').range(from, from + 999).then(function (r) {
            if (r.error) throw r.error;
            r.data.forEach(function (row) { map[row.id] = row.data; });
            if (r.data.length === 1000) return loadAll(from + 1000);
          });
        }
        var ch = sb.channel('docs-' + col + '-' + Math.random().toString(36).slice(2))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'collection=eq.' + col }, function (p) {
            if (p.eventType === 'DELETE') { if (p.old && p.old.id != null) delete map[p.old.id]; }
            else if (p.new) map[p.new.id] = p.new.data;
            emit();
          })
          .subscribe(function (status) { if (status === 'SUBSCRIBED') loadAll(0).then(emit, function (e) { onErr && onErr(errCode(e)); }); });
        return function () { sb.removeChannel(ch); };
      }
    };
  }
  function docRef(path) {
    var p = split(path), col = p[0], id = p[1];
    return {
      set: function (body) {
        return sb.from('docs').upsert({ collection: col, id: id, data: body }).then(function (r) { if (r.error) throw errCode(r.error); });
      },
      delete: function () {
        return sb.from('docs').delete().eq('collection', col).eq('id', id).then(function (r) { if (r.error) throw errCode(r.error); });
      },
      onSnapshot: function (cb, onErr) {
        var ch = sb.channel('doc-' + col + '-' + id + '-' + Math.random().toString(36).slice(2))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'collection=eq.' + col }, function (pl) {
            var row = pl.eventType === 'DELETE' ? pl.old : pl.new;
            if (!row || row.id !== id) return;
            if (pl.eventType === 'DELETE') cb({ exists: false, data: function () { return undefined; } });
            else cb({ exists: true, data: function () { return pl.new.data; } });
          })
          .subscribe(function (status) {
            if (status !== 'SUBSCRIBED') return;
            sb.from('docs').select('data').eq('collection', col).eq('id', id).maybeSingle().then(function (r) {
              if (r.error) { onErr && onErr(errCode(r.error)); return; }
              cb({ exists: !!r.data, data: function () { return r.data ? r.data.data : undefined; } });
            });
          });
        return function () { sb.removeChannel(ch); };
      }
    };
  }
  var db = { collection: collectionRef, doc: docRef };
  var user = { can: function () { return true; } };

  window.claude = {
    use: function (name) {
      if (name === 'db') return ready.then(function () { return db; });
      if (name === 'user') return ready.then(function () { return user; });
      return Promise.resolve(null); // downloads 등은 브라우저 기본 동작 사용
    }
  };
})();
</script>

진 2~3장과 소파가 놓일 벽의 길이\n2. 현관·엘리베이터 치수(문 폭과 높이, 엘리베이터 안쪽 대각선)\n3. 평소 앉는 자세와 하루에 소파에서 보내는 시간 한 줄 메모\n거실 사진을 이 번호로 먼저 보내 주시면 맞는 소파를 골라 두겠습니다."},{"code":"C2","stage":"C","name":"방문 전 리마인드","when":"방문 전 영업일 16시(월요일 예약은 금요일) — 이때 C3도 방문일 8시 30분 예약 발송으로 걸어 둠. 예약한 날이 바로 전 영업일이면 C2 생략","kind":"정보성","channel":"문자(회신 받음)","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, {예약일} {예약시간} 방문 예약을 다시 안내드립니다.\n- 주소: 경기 남양주시 수동면 남가로 1477\n편한 옷차림으로 오시면 기대거나 누워 보며 편하게 앉아 보실 수 있습니다.\n일정이 바뀌었다면 이 번호로 알려 주세요. 다른 날로 바로 옮겨 드리겠습니다."},{"code":"C3","stage":"C","name":"당일 오시는 길","when":"방문 당일 오전 8시 30분 — 전 영업일에 예약 발송으로 걸어 둠","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 오늘 {예약시간}에 뵙겠습니다.\n- 주소: 경기 남양주시 수동면 남가로 1477\n- 지도: {지도링크}\n- 담당: {담당자} / 연락처: {대표번호}\n가구단지 거리 안이 아니라 수동면 소파 공장 한편에 있는 쇼룸입니다. 늦어지시면 위 번호로 알려 주세요."},{"code":"C4","stage":"C","name":"예약 변경 확정","when":"날짜·시간을 옮긴 통화 직후(재예약 포함)","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 방문 예약을 아래 일정으로 옮겼습니다.\n- 일시: {예약일} {예약시간}\n장소와 준비하실 것은 처음 안내드린 문자와 같습니다. 그날 뵙겠습니다."},{"code":"C5","stage":"C","name":"예약 취소 확인","when":"취소 요청을 받은 직후","kind":"정보성","channel":"문자(회신 받음)","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 요청하신 대로 {예약일} 방문 예약을 취소했습니다.\n다시 오시고 싶으실 때 이 번호로 날짜만 보내 주시면 바로 잡아 드리겠습니다."},{"code":"C6","stage":"C","name":"노쇼","when":"예약 시간 +15분 확인 콜이 연결되지 않으면 +30분에(노쇼 당일)","kind":"정보성","channel":"문자(회신 받음)","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 오늘 {예약시간} 예약으로 기다리다 연락드렸습니다.\n일정이 생기셨다면 괜찮습니다. 편한 평일 날짜를 이 번호로 보내 주시면 다시 잡아 드리겠습니다."},{"code":"D1","stage":"D","name":"주문 내용 · 입금 안내","when":"주문서를 쓴 날(방문 당일 또는 나중에 계약한 날) · 입금 대기","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"쇼룸에서 바로 결제했다면 D1 대신 E1","body":"[UND 남양주 쇼룸] {고객명}님, 주문해 주셔서 감사합니다.\n작성하신 주문 내용을 보내 드립니다.\n- 모델: {모델}\n- 가죽·색: {가죽색}\n- 금액: {결제금액}\n- 입금 계좌: {입금계좌}\n- 담당: {담당자}\n입금이 확인되면 담당자가 먼저 전화드려 배송 날짜를 함께 정하고, 그 날짜에 맞춰 제작을 시작합니다.\n상담 때 정한 내용과 다른 곳이 있으면 바로 알려 주세요."},{"code":"D2","stage":"D","name":"방문 감사 — 검토 중","when":"방문 당일, 상담을 마친 뒤(17시 30분 전)","kind":"정보성","channel":"문자(회신 받음)","cond":"구매 권유·혜택·가격 링크를 넣지 않습니다","body":"[UND 남양주 쇼룸] {고객명}님, 오늘 쇼룸에 와 주셔서 감사합니다.\n오늘 앉아 보신 소파를 적어 드립니다.\n- {모델} / {가죽색}\n결정은 집에 돌아가 거실을 다시 보신 뒤에 하셔도 늦지 않습니다. 크기나 가죽 정보처럼 다시 확인하고 싶은 것이 생기면 이 번호로 편하게 물어봐 주세요."},{"code":"D3","stage":"D","name":"팔로업 D+2 — 콜 부재 시","when":"방문 뒤 2영업일 팔로업 콜이 연결되지 않을 때(연락 허락 고객)","kind":"정보성","channel":"문자(회신 받음)","cond":"구매 권유·혜택 문구를 넣지 않습니다(넣으면 광고성)","body":"[UND 남양주 쇼룸] {고객명}님, {방문일}에 쇼룸에서 뵈었던 {담당자}입니다.\n집에서 거실을 다시 보시니 어떠셨는지 여쭤보려 연락드렸습니다.\n벽 길이나 현관 치수, 가죽 색처럼 다시 확인하고 싶은 것이 있으면 이 번호로 남겨 주세요. 확인해서 답해 드리겠습니다."},{"code":"D4","stage":"D","name":"추천 글 — D+7","when":"방문 뒤 7일(검토 중 · 연락 허락 고객)","kind":"광고성","channel":"문자(알림톡 불가)","cond":"광고 수신 동의 고객만 · 21시~8시 발송 금지 · 080 수신거부 필수 · 발행된 글만","body":"(광고) UND 남양주 쇼룸\n{고객명}님, 소파를 고르실 때 참고가 될 글을 보내 드립니다.\n{추천글}\n다시 앉아 보고 싶으시면 평일 오전 9시부터 오후 5시 사이에 들러 주세요. 문의 {대표번호}\n무료수신거부 {수신거부번호}"},{"code":"E1","stage":"E","name":"결제 완료","when":"입금·결제 확인 후 1시간 안","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 결제가 확인되었습니다. 감사합니다.\n- 모델: {모델}\n- 가죽·색: {가죽색}\n- 결제 금액: {결제금액}\n- 담당: {담당자}\n영업일 하루 안에 담당자가 전화드려 배송 날짜를 함께 정하겠습니다. 날짜가 정해지면 그 날짜에 맞춰 원피를 고르고 재단을 시작합니다.\n받으시기까지 평균 15~20일(자사몰 기준)이 걸리며, 주문이 몰리는 때에는 며칠 더 걸릴 수 있습니다.\n취소·반품 조건: {취소규정}"},{"code":"E2","stage":"E","name":"배송 일정 확정","when":"배송일 조율 해피콜 직후","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 통화로 정한 배송 일정을 보내 드립니다.\n- 배송·설치: {배송일} {배송시간대}\n- 주소: {배송주소}\n배송 전에 확인해 주세요\n1. 아파트라면 관리사무소에 엘리베이터 사용 예약\n2. 소파가 지나갈 길과 놓일 자리 비워 두기\n3. 받으시는 날 댁에 계실 분과 연락받으실 번호\n현관이나 엘리베이터로 들어가기 어려우면 사다리차를 쓰게 되며, 이 비용은 따로입니다.\n받으신 날 포장을 벗긴 뒤 소파를 한 바퀴 둘러보시고, 마음에 걸리는 점은 사진과 함께 바로 알려 주세요. 배송 후 7일이 지나면 반품과 교환이 어렵습니다."},{"code":"E3","stage":"E","name":"제작 시작(선택)","when":"공장에서 재단 시작을 알려 줄 때만","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"공장 확인 없이 보내지 않습니다","body":"[UND 남양주 쇼룸] {고객명}님, 주문하신 {모델}의 원피를 골라 재단을 시작했습니다.\n봉제와 조립, 출고 전 검사를 거쳐 정해 둔 {배송일}에 맞춰 보내 드리겠습니다."},{"code":"E4","stage":"E","name":"배송 전날","when":"배송 전 영업일 오후","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, {배송일} {배송시간대}에 소파를 배송·설치합니다.\n소파가 지나갈 길과 놓일 자리를 한 번 더 비워 두세요. 일정에 변동이 생기면 미리 알려 주세요. 문의 {대표번호}"},{"code":"E5","stage":"E","name":"설치 다음 날 — 첫 석 달 안내","when":"설치 다음 영업일(해피콜과 함께)","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 새 소파와 보낸 첫날은 어떠셨는지요.\n첫 석 달 동안 알아 두시면 좋은 것을 적어 드립니다.\n- 냄새: 가죽 냄새는 환기로 옅어집니다. 첫 주에는 창을 자주 열어 주세요.\n- 먼지: 부드러운 마른 천으로 결을 따라 가볍게 쓸어 주세요.\n- 쏟았을 때: 문지르지 말고 마른 천을 대어 천에 스며들게 해 주세요. 물티슈·세제·알코올 소독제는 쓰지 않으시는 편이 좋습니다.\n- 자리: 한 달쯤 지내 보면 햇빛과 난방 바람이 닿는 자리가 보입니다. 그때 자리를 한 번 더 봐 주세요.\n마음에 걸리는 점이 있으면 사진과 함께 바로 알려 주세요. 배송 후 7일이 지나면 반품과 교환이 어렵습니다. 문의 {대표번호}"},{"code":"E6","stage":"E","name":"한 달 안부","when":"설치 30일 뒤","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 소파를 들이신 지 한 달이 되었습니다.\n설치한 날 정한 자리는 대개 그날의 거실을 보고 정한 자리입니다. 해가 기우는 늦은 오후나 난방을 켜는 저녁의 거실도 한 번 보시고, 햇빛과 난방 바람이 오래 닿는다면 자리를 조금 옮겨 보세요.\n쓰시면서 궁금한 점은 언제든 물어봐 주세요. 문의 {대표번호}"},{"code":"E7","stage":"E","name":"석 달 안부","when":"설치 90일 뒤","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 소파를 들이신 지 석 달이 되었습니다.\n이맘때면 자주 앉는 자리에 주름과 윤이 생기기 시작합니다. 가죽이 그 집의 손길에 길드는 모습입니다.\n관리는 지금처럼 마른 천으로 가볍게 쓸어 주시면 충분합니다. 가죽 전용 제품을 쓰고 싶으시면 쓰시는 라인의 마감에 맞는지 먼저 물어봐 주세요."},{"code":"F1","stage":"F","name":"1:1 상담 전환 — 방문이 어려울 때","when":"거리·주말 문제로 방문이 어렵다는 통화 직후","kind":"정보성","channel":"문자(회신 받음)","cond":"고객이 요청한 상담에 대한 안내","body":"[UND 남양주 쇼룸] {고객명}님, 통화 감사합니다.\n방문이 어려우시면 아래 세 가지를 이 번호로 보내 주세요. 맞는 크기와 라인을 함께 좁혀 답해 드리겠습니다.\n1. 창과 문, 난방기 위치가 보이는 거실 사진 2~3장\n2. 소파가 놓일 벽의 길이\n3. 주로 앉는 인원과 평소 자세\n모델별 크기와 가격은 자사몰({자사몰})에도 나와 있습니다."},{"code":"F2","stage":"F","name":"예약 보류 — 날짜 미정","when":"관심은 있으나 날짜를 못 정한 통화 직후","kind":"정보성","channel":"문자(회신 받음)","cond":"—","body":"[UND 남양주 쇼룸] {고객명}님, 통화 감사합니다. 말씀하신 대로 일정이 정해질 즈음 다시 연락드리겠습니다.\n- 운영: 평일 오전 9시~오후 5시(주말 휴무)\n- 위치: 경기 남양주시 수동면 남가로 1477(소파 공장 옆 쇼룸)\n날짜가 먼저 정해지면 이 번호로 보내 주세요. 그 시간으로 잡아 드리겠습니다."},{"code":"F3","stage":"F","name":"수신거부 처리 결과","when":"광고성 문자 수신거부 요청을 처리한 즉시(늦어도 14일 안)","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"법정 통지 — 요청일·처리 결과를 넣습니다","body":"[UND 남양주 쇼룸] {요청일}에 요청하신 광고성 정보(문자) 수신거부를 {처리일}에 처리했습니다.\n앞으로 광고성 문자는 보내지 않고, 예약과 주문에 관한 안내만 필요할 때 드리겠습니다."},{"code":"G1","stage":"G","name":"월 1회 소식 — 장기 관리","when":"매월 첫 영업일 — 장기 관리·부재 종료 고객 중 광고 수신 동의 고객","kind":"광고성","channel":"문자(알림톡 불가)","cond":"광고 수신 동의 고객만 · 21시~8시 발송 금지 · 080 수신거부 필수 · 발행된 글만","body":"(광고) UND 남양주 쇼룸\n{고객명}님, 이번 달 UND 공식 블로그에 올린 글을 보내 드립니다.\n{추천글}\n소파를 다시 보고 싶으실 때 평일 오전 9시부터 오후 5시 사이에 남양주 쇼룸에 들러 주세요. 문의 {대표번호}\n무료수신거부 {수신거부번호}"},{"code":"G2","stage":"G","name":"광고 수신 동의 확인 — 2년마다","when":"광고 동의일(접수일)로부터 2년이 되기 전 — 30일 전부터 「오늘」 화면에 대상 수가 뜹니다","kind":"정보성","channel":"문자 · 알림톡 가능","cond":"법정 안내 — 광고 문구를 넣지 않습니다","body":"[UND 남양주 쇼룸] {고객명}님은 {동의일}에 UND의 광고성 정보(문자) 수신에 동의하셨습니다.\n계속 받으시려면 따로 하실 일은 없습니다. 그만 받으시려면 아래 번호로 전화해 주세요.\n무료수신거부 {수신거부번호}"}],"stages":{"A":"접수","B":"부재","C":"예약","D":"방문 후","E":"결제·배송","F":"상황별","G":"장기·동의"},"variables":["고객명","대표번호","예약일","예약시간","담당자","지도링크","자사몰","모델","가죽색","결제금액","입금계좌","취소규정","배송일","배송시간대","배송주소","방문일","추천글","동의일","요청일","처리일","수신거부번호"],"callResults":[{"v":"예약확정","kind":"conn","st":"08 예약 확정","next":"날짜·시간 고르기 → C1"},{"v":"예약보류","kind":"conn","st":"06 예약 보류","next":"F2 → 다시 연락할 날"},{"v":"콜백요청","kind":"conn","st":"05 콜백 예정","next":"다시 연락할 일시"},{"v":"1:1상담","kind":"conn","st":"07 1:1 상담","next":"F1 사진 요청"},{"v":"관심없음","kind":"conn","st":"90 이탈","next":"끝 — 사유 메모"},{"v":"부재","kind":"na","st":"02–04 부재","next":"회차대로 B1 · B2 · B3"},{"v":"통화중·거절","kind":"na","st":"02–04 부재","next":"회차대로 B1 · B2 · B3"},{"v":"결번·오류","kind":"void","st":"99 무효","next":"끝 — 리드 품질로 보고"},{"v":"오신청","kind":"void","st":"99 무효","next":"사과 → 고객 삭제"}],"lists":{"src":["Meta 리드폼","네이버 블로그","자사몰 문의","전화 문의","워크인","코스트코 문의","지인 소개","기타"],"party":["1명","2명","3명","4명 이상"],"close":["이탈","무효","장기관리"],"dslot":["오전","오후","시간 협의"]},"script":[{"step":"인사·확인","sec":"10초","kind":"","say":"안녕하세요, 남양주 유엔디 소파 쇼룸 {상담원}입니다. {고객명}님이시죠? 인스타그램에서 쇼룸 방문 예약 신청해 주셔서 날짜 잡아 드리려고 연락드렸어요. 1분이면 돼요.","tip":"「통화 괜찮으세요?」는 묻지 않고 바로 다음 단계로. 바쁘다 → 「몇 시쯤 다시 전화드리면 될까요?」 → 콜백요청"},{"step":"날짜 두 개","sec":"20초","kind":"slots","say":"쇼룸이 평일에만 열어서요. {제안1}이나 {제안2} 중에 언제가 편하세요?","tip":"캘린더의 빈 시간 두 개(서로 다른 날 · 오전 하나 오후 하나)를 도우미가 골라 둡니다. 「아무 때나요」 → 「그럼 가장 빠른 {제안1}에 잡아 드릴게요.」"},{"step":"인원·복창","sec":"15초","kind":"party","say":"몇 분이 같이 오세요? … 그럼 {고른날} {인원말} 오시는 걸로 잡아 둘게요.","tip":"혼자 오신다면: 「소파를 같이 쓰실 분과 오시면 나란히 앉아 보고 한 번에 정하시기 좋아요.」"},{"step":"문자 안내·끝","sec":"15초","kind":"","say":"주소랑 오시는 길은 문자로 바로 보내 드릴게요. 거실 사진이랑 소파 놓일 벽 길이도 보내 주시면 앉아 보실 소파를 미리 골라 둘게요. 그날 뵙겠습니다.","tip":"끊고 바로 결과 「예약확정」 → 예약이 캘린더에 들어가고 C1 문자가 열립니다."}],"rules4":[["들어온 날 안에","첫 콜은 리드가 들어온 날 안에. 빨리 걸수록 잘 받습니다. 밤·주말 리드는 다음 영업일 오전에."],["시간은 두 개","「언제가 편하세요?」 대신 두 시간을 내고 고르게 합니다."],["질문엔 한 줄","답하고 같은 두 시간으로 돌아옵니다. 소파·가죽 설명은 쇼룸에서."],["끊고 바로 C1","날짜·시간·인원을 복창하고, 끊자마자 예약 확정 문자를 보냅니다."]],"dateRules":[["두 개는 다르게","서로 다른 날 · 오전 하나 오후 하나 · 가까운 날부터(날이 멀수록 일정이 바뀌기 쉽습니다)"],["열린 시간","캘린더에서 「닫힘」이 아닌 빈 칸 — 09:30 · 11:30 · 13:30 · 15:30(상담 2명 기준 안) · 16:00은 재방문"],["당일 예약","지금부터 2시간 뒤 시간부터"],["먼 고객","1시간 넘게 걸리면 11:30 이후 — 도우미의 「먼 고객」을 켜면 그렇게 고릅니다"],["고객이 먼저 말하면","비어 있으면 바로 확정 · 차 있으면 앞뒤 시간 하나"],["3주보다 먼 날","예약 대신 「예약보류」 → 다시 연락할 날에 그 주"]],"qa":[{"q":"가격이 얼마예요?","a":"모델과 가죽에 따라 300만 원대부터 500만 원대까지예요. 차이가 어디서 나는지는 쇼룸에서 직접 보여 드릴게요.","memo":"정확한 금액을 지어내지 않습니다 · 자사몰 링크는 고객이 원할 때만","tags":"가격 얼마 비용 금액 견적"},{"q":"할인이나 이벤트 있어요?","a":"할인이나 이벤트는 따로 하지 않아요.","memo":"사은품·「오늘만」 약속 금지","tags":"할인 이벤트 사은품 행사 세일"},{"q":"주말에 가도 돼요?","a":"쇼룸은 평일 오전 9시부터 오후 5시까지만 열어요. 평일 아침 9시 반이나 오후 3시 반은 어떠세요?","memo":"그래도 평일이 안 되면 1:1 사진 상담(F1)","tags":"주말 토요일 일요일 공휴일 운영 시간 영업"},{"q":"어디에 있어요?","a":"남양주 수동면, 소파 공장 바로 옆이에요. 가구단지 거리 안이 아니라서 주소를 문자로 보내 드릴게요.","memo":"주소는 C1·C3 문자로 갑니다","tags":"위치 주소 어디 가구단지 주차 오시는 길"},{"q":"거리가 멀어요.","a":"오시기 전에 거실 사진으로 후보를 좁혀 두면 한 번 오셔서 정하실 수 있게 준비해 둘게요.","memo":"9시 반은 피하고 11시 반 이후로 · 그래도 어려우면 1:1 사진 상담(F1)","tags":"멀어요 거리 지방 원거리"},{"q":"예약 안 하고 그냥 가도 돼요?","a":"네, 오셔도 돼요. 평일엔 오신 순서대로라 기다리실 수 있어요. 날짜를 정해 주시면 맞는 소파를 미리 골라 둘게요.","memo":"「먼저 봐 드려요」 「안 기다리세요」는 말하지 않습니다(대표 확인 전)","tags":"예약 없이 그냥 방문 순번 대기"},{"q":"진짜 가죽 맞아요?","a":"축종·원산지·가공한 나라·등급, 어느 면에 어떤 가죽을 썼는지까지 쇼룸에서 하나씩 확인해 드려요.","memo":"다른 가죽과 비교해 물으면 필수 문장: 「어느 가죽이 무조건 우월하다는 이야기가 아닙니다. 중요한 것은 제품의 용도에 맞는 가죽을 선택했는가입니다.」","tags":"진짜 가죽 천연 소가죽 인조 광고"},{"q":"통가죽이에요, 부분가죽이에요?","a":"모델마다 달라요. 앉는 면, 옆판, 뒷면에 어떤 소재를 썼는지 쇼룸에서 그대로 보여 드릴게요.","memo":"부분가죽을 나쁘다고 말하지 않습니다 — 알려 드리는 것이 기준","tags":"통가죽 부분가죽 소재"},{"q":"리클라이너 있어요?","a":"리클라이너는 따로 없고, 등받이가 움직여 기대는 각도가 바뀌는 스윙 라인이 있어요. 쇼룸에서 직접 보여 드릴게요.","memo":"보고 싶은 모델은 예약 메모에 — 전시 여부를 확인","tags":"리클라이너 스윙 등받이 전동"},{"q":"코너형이나 카우치도 있어요?","a":"지금은 카우치나 코너형은 없어요. 거실 폭에 맞는 크기를 쇼룸에서 같이 봐 드릴게요.","memo":"없는 제품을 있다고 하지 않습니다","tags":"코너 카우치 ㄱ자 모듈"},{"q":"주문하면 얼마나 걸려요?","a":"주문받고 만드는 소파라 자사몰 기준 평균 15~20일 걸려요. 몰릴 때는 며칠 더 걸릴 수 있어요.","memo":"이사 날짜가 있으면 「그 전에 받으시려면 이번 주나 다음 주에 앉아 보시면 좋아요」","tags":"배송 기간 제작 얼마나 언제 받아 이사 입주"},{"q":"가족이랑 상의해 볼게요.","a":"그럼 함께 오실 수 있는 날로 잡아 볼까요? 나란히 앉아 보시면 한 번에 정하기 좋아요.","memo":"예약할 때 인원에 기록","tags":"가족 남편 아내 상의 같이"},{"q":"그냥 구경만 하려고요.","a":"네, 편하게 앉아 보셔도 돼요. 오늘 정하지 않으셔도 괜찮아요.","memo":"더 권하지 않고 바로 날짜로","tags":"구경 그냥 보기만"},{"q":"코스트코에서 본 거랑 같은 거예요?","a":"보신 제품 이름을 알려 주시면 같은 소파인지 확인해서 알려 드릴게요.","memo":"공식 판매처는 자사몰 · 코스트코 · 남양주 쇼룸","tags":"코스트코 판매처 같은 제품 모델명"},{"q":"인터넷에 더 싸게 올라온 게 있던데요.","a":"자사몰, 코스트코, 남양주 쇼룸 말고 다른 곳의 판매 글은 공식 유통이 아니어서 배송이나 사후 관리를 약속드리기 어려워요.","memo":"다른 판매자를 깎아내리지 않고 사실만","tags":"인터넷 최저가 싸게 중고"},{"q":"지방인데 배송 돼요?","a":"주소를 알려 주시면 확인해서 알려 드릴게요. 도서산간 지역은 배송이 어려운 제품이 있어요.","memo":"가능 여부를 단정하지 않습니다","tags":"지방 배송 도서산간 제주"},{"q":"A/S나 보증은 어떻게 돼요?","a":"기간과 범위를 정확히 확인해서 문자로 답해 드릴게요.","memo":"메모에 남기고 다음 영업일까지 회신 · 「평생」 「무상」 약속 금지","tags":"AS A/S 보증 수리 사후"},{"q":"허리가 안 좋은데 어떤 게 좋아요?","a":"어떤 소파가 건강에 좋다고 말씀드리기는 어려워요. 평소 앉는 자세대로 여러 대 앉아 보시면서 맞는지 같이 봐 드릴게요.","memo":"건강·교정 효과 표현 금지","tags":"허리 건강 자세 디스크"},{"q":"가죽 냄새 많이 나요?","a":"새 가죽은 처음에 냄새가 있고 환기하면서 옅어져요. 며칠이라고 말씀드리기는 어려워요.","memo":"날짜를 단정하지 않습니다","tags":"냄새 새 가죽"},{"q":"크기를 맞춰서 만들 수 있어요?","a":"모델별로 정해진 크기에서 고르세요. 다른 크기가 필요하시면 가능한지 확인해서 알려 드릴게요.","memo":"확인 없이 맞춤 제작을 약속하지 않습니다","tags":"크기 맞춤 주문 제작 사이즈"}],"exits":[["지금 통화가 어렵다","몇 시쯤 다시 전화드리면 될까요?","","콜백요청 · 다시 연락할 일시"],["날짜를 아직 못 정한다","그럼 언제쯤 다시 연락드리면 될까요?","F2","예약보류 · 다시 연락할 날(비우면 3영업일 뒤)"],["3주보다 먼 날만 된다","그 주가 되면 먼저 연락드려 날짜를 잡아 드릴게요.","F2","예약보류 · 다시 연락할 날에 그 주"],["평일이 안 되거나 너무 멀다","거실 사진 두세 장이랑 벽 길이를 문자로 보내 주시면 맞는 크기와 라인을 먼저 좁혀 드릴게요.","F1","1:1상담"],["관심이 없다","알겠습니다. 시간 내 주셔서 감사합니다.","","관심없음"],["신청한 적이 없다","확인 없이 연락드려 죄송합니다. 남기신 정보는 바로 삭제해 둘게요.","","오신청 → 고객 삭제"]],"cadence":[["1회차 · 접수한 날","1차 통화 → 안 받으면 B1 · 2시간 뒤 한 번 더(17시 전 접수분, 문자 없음)","밤·주말 접수는 다음 영업일 오전에 1회차"],["2회차 · 다음 영업일","1회차와 다른 시간대 → 안 받으면 B2","오전이었으면 12:30–13:30, 오후였으면 10시 전후"],["3회차 · 2영업일 뒤","아직 안 걸어 본 시간대 → 안 받으면 B3 → 전화 멈춤","17:30–18:00도 좋음 · 그 뒤엔 고객이 연락할 때만"]],"reconnect":[["다시 건 통화가 연결됨","{고객명}님, 남양주 유엔디 소파 쇼룸입니다. 쇼룸 방문 예약 신청 건으로 다시 연락드렸어요.","날짜 두 개부터"],["고객이 전화해 옴","예약 신청 주신 {고객명}님이시죠? 날짜만 바로 잡아 드릴게요.","날짜 두 개부터 · 통화 결과 기록"],["「전화 주세요」 문자가 옴","문자 남겨 주셔서 연락드렸어요.","그날 안에 전화 · 날짜 두 개부터"],["콜백 약속 시각","말씀하신 시간이라 다시 연락드렸어요.","약속 시각을 넘기지 않음 · 안 받으면 부재 1회차부터"],["문자로 날짜를 보내 옴","","전화 없이 「예약 잡기」 → C1"]],"afterBooking":[["방문 전 영업일 16시","","C2를 보내고 C3를 방문일 8시 30분 예약 발송으로 걸어 둠 → 둘 다 「보냄으로 기록」 · 월요일 예약은 금요일 · 바로 전 영업일에 잡은 예약은 C3만"],["C2에 답이 없고 먼 고객 · 선택","{예약일} {예약시간}에 뵙기로 해서 확인차 연락드렸어요. 오시는 길 안내가 더 필요하실까요?","방문 전 영업일 17시 전후"],["옮기고 싶다","네, 언제로 옮겨 드릴까요?","날짜 두 개 → 복창 → 「예약 변경」 → C4 · 걸어 둔 옛 C3 취소"],["취소하고 싶다","네, 취소해 드릴게요. 혹시 다른 날로 옮겨 드릴까요?","다른 날은 한 번만 묻기 → 안 되면 방문 결과 「취소」 → C5 · 걸어 둔 C3 취소"],["노쇼 — 예약 +15분","{고객명}님, 남양주 유엔디 소파 쇼룸입니다. 오늘 {예약시간} 예약이셔서, 혹시 오시는 길이신가 해서 연락드렸어요.","오는 중이면 「천천히 오세요」 · 못 오면 날짜 두 개 → C4 · 안 받으면 방문 결과 「노쇼」 → +30분에 C6"],["노쇼 다음 영업일 · 한 번만","{예약일}에 일정이 생기셨던 것 같아 다시 연락드렸어요. 편한 날로 다시 잡아 드릴까요?","되면 「다시 예약」 → C4 · 안 되면 종료 「장기관리」"]],"followup":[["D+2 영업일 · 첫 팔로업","{고객명}님, 남양주 유엔디 소파 쇼룸입니다. {방문일}에 쇼룸에 다녀가셔서 연락드렸어요. 집에서 거실 다시 보시니 어떠셨어요?\n결정은 천천히 하셔도 돼요. 혹시 일주일쯤 뒤에 한 번 더 연락드려도 될까요?","듣는 것이 먼저 · 다시 앉아 보고 싶다 → 「다시 예약」 → C1 · 안 받으면 D3 · 통화했으면 「D+2 완료」"],["D+7","","D4 추천 글 — 광고 동의 고객만 · 발행된 글과 링크"],["D+14 · 마지막","혹시 아직 고민 중이시면 다시 앉아 보러 오셔도 좋아요. 앞으로 전화는 더 드리지 않을게요. 필요하실 때 이 번호로 연락 주세요.","「D+14 완료」 → 상담 결과(계약·이탈) 또는 종료 「장기관리」"]],"donts":[["「예약하시면 먼저 봐 드려요」 「안 기다리세요」","예약 고객 우선 응대는 대표 확인 전"],["할인·이벤트·사은품, 「오늘만」 「곧 품절」","할인 없음 · 압박하지 않는 것이 쇼룸 원칙"],["「일주일이면 와요」 「평생 A/S」 「크기 맞춰 드릴게요」","확정되지 않은 약속"],["「최고급」 「명품」, 다른 매장·다른 가죽 깎아내리기","확인할 수 있는 말만"],["가죽·구조에 대한 긴 설명","쇼룸에서 직접 보여 드림 · 통화는 1분"],["「왜 안 받으셨어요」처럼 들리는 말","다시 건 통화는 인사부터 가볍게"]],"howto":[["오늘","매일 아침 여기부터. 빨간 「지연」 → 노란 「오늘」 순서로, 줄마다 있는 버튼 하나로 처리합니다."],["고객","리드 한 명 = 카드 한 장. 통화·문자·예약을 기록하면 진행상태와 다음 할 일이 저절로 바뀝니다."],["캘린더","평일 × 예약 시간. 빈 칸을 누르면 바로 예약, 이름을 누르면 고객 카드가 열립니다."],["통화 도우미","60초 스크립트에 고객 이름과 가까운 빈 시간 두 개가 채워집니다. 결과 버튼 하나로 기록합니다."],["문자","27종이 고객 정보로 채워집니다. 복사해서 보내고 「보냄으로 기록」을 누릅니다."],["설정","대표번호 · 지도 링크 · 080 · 담당자 · 예약 시간 · 공휴일 · 추천 글 · 백업."]],"day":[["09:00","「오늘」의 빨간 지연부터 — 밤·주말에 들어온 리드 첫 통화"],["수시","새 리드는 접수한 날 안에 1차 통화 · 고객 문자 회신은 바로"],["16:00","다음 영업일 예약 — C2 보내고 C3 예약 발송(월요일 예약은 금요일)"],["예약 +15분","안 오면 확인 콜 → 안 받으면 +30분에 C6"],["17:00–18:00","오늘 한 통화·문자를 다 기록했는지 — 지연 0건으로 마감"]],"rules":[["일어난 일만","통화하면 결과 버튼, 문자를 보내면 「보냄으로 기록」. 진행상태 · 다음 할 일 · 날짜는 앱이 정합니다."],["부재 회차","같은 날 두 번째 부재는 회차로 세지 않습니다(기록은 해 두어도 됩니다). 통화가 한 번 연결되면 부재는 1회부터 다시 셉니다."],["예약을 옮기면","고객 카드나 캘린더에서 「예약 변경」 → C4. 노쇼·취소 뒤 다시 잡으면 「다시 예약」 — 방문 결과가 자동으로 비워집니다."],["워크인","「+ 새 리드」에서 유입경로 「워크인」 → 방문 결과 「방문」(방문일은 오늘)."],["멈출 때","더 연락하지 않을 때만 종료(이탈 · 무효 · 장기관리). 고객이 다시 연락하면 종료를 풉니다."],["오신청 · 삭제 요청","고객 카드 맨 아래 「고객 삭제」. 삭제 요청은 받은 날 처리합니다."]],"status":[{"code":"01","label":"신규","next":"1차 통화 — 접수한 날 안에(밤·주말 접수는 다음 영업일 오전)"},{"code":"02","label":"부재 1회","next":"B1 문자 → 다음 영업일 다른 시간대에 2차 통화"},{"code":"03","label":"부재 2회","next":"B2 문자 → 2영업일 뒤 3차 통화"},{"code":"04","label":"부재 종료","next":"B3 문자 → 전화 멈춤 · 광고 동의 고객만 월 1회 G1"},{"code":"05","label":"콜백 예정","next":"약속한 시간에 콜백"},{"code":"06","label":"예약 보류","next":"F2 문자 → 고객이 말한 날(없으면 3영업일 뒤) 다시 연락"},{"code":"07","labe         if (k === 'visit') { c.visitAt = v ? now() : ''; if (v === '방문' && !(c.rsv && c.rsv.date)) c.rsv = { date: today(), time: '', at: now(), walkIn: true }; }
        if (k === 'cres') c.cresAt = v ? now() : '';
        if (k === 'dDate') c.dDateAt = v ? now() : '';
        if (['visit', 'cres', 'fu', 'mkt', 'pDate', 'dDate'].indexOf(k) >= 0) logPush(c, '변경', ({ visit: '방문 결과', cres: '상담 결과', fu: '팔로업', mkt: '광고 동의', pDate: '결제일', dDate: '배송일' })[k] + ' 「' + (v || '비움') + '」');
      }, null);
      return;
    }
    if (t.dataset.set) { S.settings[t.dataset.set] = t.value.trim(); saveSettings('저장했습니다'); return; }
    if (t.dataset.slot) { S.settings.slots[+t.dataset.slot][t.dataset.k] = t.checked; saveSettings('예약 시간을 바꿨습니다'); return; }
    if (t.dataset.post) { S.settings.posts[+t.dataset.post][t.dataset.k] = t.value.trim(); saveSettings('추천 글을 저장했습니다'); return; }
    if (t.id === 'f-grp') { S.f.grp = t.value; VIEW.customers.update(); return; }
    if (t.id === 'f-staff') { S.f.staff = t.value; VIEW.customers.update(); return; }
    if (t.id === 'call-cid') { pickCall(t.value); VIEW.call.update(); return; }
    if (t.id === 'call-far') { S.call.far = t.checked; S.call.pick = 0; S.call.alt = null; VIEW.call.update(); return; }
    if (t.id === 'call-consult') { S.call.consult = t.value; return; }
    if (t.id === 'sms-cid') { S.smsCid = t.value; VIEW.sms.update(); return; }
    if (t.id === 'sms-post') { S.post = t.value; VIEW.sms.update(); return; }
    if (t.id === 'sms-req') { S.reqDate = t.value; VIEW.sms.update(); return; }
    if (t.id === 'm-req') { var mr = S.modal; mr.req = t.value; mr.text = fillSms(SMS[mr.code].body, smsVars(C()[mr.id], mr)); $('#m-text').value = mr.text; composerHoles(mr); return; }
    if (t.id === 'm-code' || t.id === 'm-post') {
      var m = S.modal; if (t.id === 'm-code') m.code = t.value; if (t.id === 'm-post') { m.post = t.value; S.post = t.value; }
      m.text = fillSms(SMS[m.code].body, smsVars(C()[m.id], m)); m.title = m.code + ' 문자'; renderModal(); return;
    }
    if (t.id === 'n-src') { S.modal.src = t.value; $('#n-extra').innerHTML = newLeadExtra(S.modal); return; }
    if (t.id === 'import-file' && t.files && t.files[0]) { importJson(t.files[0]); t.value = ''; return; }
    var im = S.modal && S.modal.type === 'imp' ? S.modal : null;
    if (im) {
      if (t.dataset.imp) { im.map[t.dataset.imp] = t.value === '' ? null : +t.value; im.memo = im.memo.filter(function (j) { return j !== +t.value; }); im.openMap = true; renderModal(); return; }
      if (t.dataset.impmemo != null) { var j = +t.dataset.impmemo; im.memo = t.checked ? im.memo.concat([j]).sort(function (a, b) { return a - b; }) : im.memo.filter(function (x) { return x !== j; }); impRefresh(); return; }
      if (t.dataset.impoff != null) { im.off[+t.dataset.impoff] = !t.checked; impRefresh(true); return; }
      if (t.id === 'imp-tm') { im.tm = t.value; return; }
      if (t.id === 'imp-dup') { im.dup = t.value; impRefresh(); return; }
      if (t.id === 'imp-since') { im.since = t.value; impRefresh(); return; }
      if (t.id === 'imp-hdr') { im.hi = t.checked ? Math.max(0, findHeader(im.raw)) : -1; impShape(im); im.openMap = true; renderModal(); return; }
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'f-q') { S.f.q = t.value; VIEW.customers.update(); return; }
    if (t.id === 'qa-q') { S.call.q = t.value; VIEW.call.qa(); return; }
    if (t.id === 'n-phone' && S.modal && S.modal.type === 'newLead') { S.modal.phone = t.value; $('#n-extra').innerHTML = newLeadExtra(S.modal); return; }
    if (t.id === 'm-text') { $('#m-bytes').textContent = bytesLabel(t.value); return; }
    if (t.id === 'es-body') { esBytes(); return; }
    if (t.id === 'top-q') { searchResults(t.value); return; }
    if (t.id === 'r-q') {
      var q = t.value.trim().toLowerCase().replace(/-/g, '');
      var hits = q ? list().filter(function (x) { return ((x.c.name || '') + (x.c.phone || '')).toLowerCase().replace(/-/g, '').indexOf(q) >= 0; }).slice(0, 6) : [];
      $('#r-found').innerHTML = hits.map(function (x) { return '<button class="btn sm" data-act="r-choose" data-id="' + esc(x.c.id) + '" style="margin:2px">' + esc(x.c.name) + ' · ' + esc(x.d.label) + '</button>'; }).join('') || (q ? '<span class="muted">없습니다 — 아래에 새로 넣으세요</span>' : '');
    }
  });
  document.addEventListener('toggle', function (ev) { var d = ev.target; if (d && d.dataset && d.dataset.fold) S.folds[d.dataset.fold] = d.open; }, true);
  function searchResults(v) {
    var box = $('#search-res'), q = v.trim().toLowerCase().replace(/-/g, '');
    if (!q) { box.hidden = true; return; }
    var hits = list().filter(function (x) { return ((x.c.name || '') + ' ' + (x.c.phone || '')).toLowerCase().replace(/-/g, '').indexOf(q) >= 0; }).sort(byPriority).slice(0, 8);
    box.innerHTML = hits.length ? hits.map(function (x) { return '<button data-act="search-go" data-id="' + esc(x.c.id) + '"><b>' + esc(x.c.name) + '</b><span class="num muted small">' + phoneDisp(x.c.phone) + '</span>' + stChip(x.d) + '</button>'; }).join('') : '<div class="empty">찾는 고객이 없습니다</div>';
    box.hidden = false;
  }
  ACT['search-go'] = function (el) { $('#search-res').hidden = true; $('#top-q').value = ''; openDrawer(el.dataset.id); };
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (S.modal) closeModal(); else if (S.drawer) closeDrawer(); else { var sr = $('#search-res'); if (sr) sr.hidden = true; } }
    if (ev.key === 'Enter' && ev.target.id === 'top-q') { var b = $('#search-res button'); if (b) b.click(); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('label[role="button"]')) { ev.preventDefault(); var fi = ev.target.querySelector('input[type="file"]'); if (fi) fi.click(); }
  });
  // 파일을 화면에 끌어다 놓기
  var dragN = 0, dragT = null;
  function hasFiles(ev) { var ty = ev.dataTransfer && ev.dataTransfer.types; if (!ty) return false; for (var i = 0; i < ty.length; i++) if (ty[i] === 'Files') return true; return false; }
  function dropHideSoon() { clearTimeout(dragT); dragT = setTimeout(function () { dragN = 0; $('#drop').hidden = true; }, 500); }
  document.addEventListener('dragenter', function (ev) { if (!hasFiles(ev)) return; ev.preventDefault(); dragN++; if (realWritable()) $('#drop').hidden = false; dropHideSoon(); });
  document.addEventListener('dragover', function (ev) { if (!hasFiles(ev)) return; ev.preventDefault(); dropHideSoon(); try { ev.dataTransfer.dropEffect = realWritable() ? 'copy' : 'none'; } catch (e) { } });
  document.addEventListener('dragleave', function (ev) { if (!hasFiles(ev)) return; dragN = Math.max(0, dragN - 1); if (!dragN) $('#drop').hidden = true; });
  document.addEventListener('drop', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault(); dragN = 0; $('#drop').hidden = true;
    var f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) importFile(f);
  });

  // ---------------------------------------------------------------- 테마 · 시계
  function applyTheme() {
    var t = UI.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  var lastDay = today();
  setInterval(function () {
    if (S.view === 'call' && S.call.start) { var el = $('#call-clock'); if (el) { var s = Math.round((Date.now() - S.call.start) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); } }
    if (today() !== lastDay) { lastDay = today(); S.calStart = mondayOf(lastDay); scheduleRender(); }
  }, 1000);
  setInterval(function () { if (!S.modal && !S.dragging) scheduleRender(); }, 60000);

  // ---------------------------------------------------------------- 시작
  function boot() {
    applyTheme();
    $('#search-ico').innerHTML = ICON.search;
    var h = (location.hash || '').replace('#', '');
    S.view = VIEW[h] ? h : (VIEW[UI.view] ? UI.view : 'today');
    var hasClaude = window.claude && typeof window.claude.use === 'function';
    if (hasClaude) {
      S.mode = 'loading';
      window.claude.use('downloads').then(function (d) { Store.dl = d; }, function () { });
      initShared().then(function (ok) { if (!ok) initLocal('fallback'); else mountView(); }, function () { initLocal('fallback'); });
    } else initLocal('');
    mountView(); renderNav(); renderBanner();
  }
  window.UNDApp = { S: S, derive: function (c, t) { return L.derive(c, t || today(), cal); }, demo: demoData, _imp: { normPhone: normPhone, normTime: normTime, yesNo: yesNo, autoMap: autoMap, findHeader: findHeader },
    _applyStatus: function (c, code) { var cc = clone(c); applyStatus(cc, code); return cc; } };
  boot();
})();
